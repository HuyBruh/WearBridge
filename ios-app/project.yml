name: AncsBridge
options:
  bundleIdPrefix: com.wearos
  deploymentTarget:
    iOS: "26.0"

targets:
  AncsBridge:
    type: application
    platform: iOS
    sources:
      - AncsBridge
    info:
      path: AncsBridge/Info-Generated.plist
      properties:
        CFBundleDisplayName: "WearBridge"
        LSRequiresIPhoneOS: true
        NSBluetoothAlwaysUsageDescription: "WearBridge needs Bluetooth to connect to your Pixel Watch and forward notifications."
        NSBluetoothPeripheralUsageDescription: "WearBridge needs Bluetooth to be discoverable by your Pixel Watch."
        NSCalendarsFullAccessUsageDescription: "Share the next three calendar events with your paired watch when you enable calendar sharing."
        NSHealthUpdateUsageDescription: "Save workouts, heart rate, steps and active energy recorded by your Pixel Watch."
        NSLocationWhenInUseUsageDescription: "Show the weather where you are on your watch."
        NSRemindersFullAccessUsageDescription: "Show today's reminders on your watch and tick them off from there."
        NSCameraUsageDescription: "Use your paired watch as a shutter while the camera is open."
        NSPhotoLibraryAddUsageDescription: "Save photos captured with the remote shutter."
        UIBackgroundModes:
          - bluetooth-peripheral
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wearos.ancsbridge.companion
        MARKETING_VERSION: "1.7"
        CURRENT_PROJECT_VERSION: "7"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: AncsBridge/AncsBridge.entitlements
        DEVELOPMENT_TEAM: R68RHN3HF5
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          CODE_SIGN_STYLE: Automatic

  AncsBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AncsBridgeTests
    dependencies:
      - target: AncsBridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
